services:
  - type: web
    runtime: docker
    name: studypilot
    plan: free
    dockerContext: ./studypilot
    dockerfilePath: ./studypilot/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
