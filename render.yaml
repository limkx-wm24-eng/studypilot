services:
  - type: web
    runtime: docker
    name: studypilot
    plan: free
    dockerContext: ./studypilot
    dockerfilePath: ./studypilot/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: MAIL_PROVIDER
        value: brevo
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        value: https://studypilot-zsnh.onrender.com
