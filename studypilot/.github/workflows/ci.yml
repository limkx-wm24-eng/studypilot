name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studypilot_test
          POSTGRES_USER: studypilot
          POSTGRES_PASSWORD: studypilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studypilot -d studypilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build:all
      - run: npm test
        env:
          DATABASE_URL: postgresql://studypilot:studypilot@localhost:5432/studypilot_test
